function match(t, key){
  if (key === "all") return true;
  if (key === "new") return t.isNew;
  if (key === "se" || key === "pa") return t.lg === key;
  return t.team === key || (t.rel || "").split("/").includes(key);
}
const youbi = ["日","月","火","水","木","金","土"];
function fmtDate(at){
  if (!at) return '<span class="dt">日時不明</span>';
  const m = at.match(/^(\d{4})\/(\d{2})\/(\d{2}) (\d{2}:\d{2}(?::\d{2})?)$/);
  if (!m) return `<span class="dt">${esc(at)}</span>`;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return `<span class="dt">${m[1]}/${m[2]}/${m[3]}(${youbi[d.getDay()]}) ${m[4]}</span>`;
}
function bodyHtml(b, group){
  return esc(b).replace(/&gt;&gt;(\d{1,4})/g, (s, n) => `<button class="anc" data-to="${group}-${n}">&gt;&gt;${n}</button>`);

function newsHtml(t){
  const links = t.links.map(l => `<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.n)}</a>`).join("、");

  if (text.includes(BLOCK)) text = text.replace(esc(BLOCK), `<strong>${esc(BLOCK)}</strong>`);
  return text + (links ? `（${links}）` : "");

  document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { seg = b.dataset.seg; renderThread(t); }));
  document.querySelectorAll(".anc").forEach(b => b.addEventListener("click", () => {
    const el = document.getElementById(b.dataset.to);
    if (!el) { b.title = "参照先のレスは取得範囲外です"; return; }
    el.scrollIntoView({block:"center"}); el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 1400);
  }));
}
let listY = 0;
function route(){
  const m = location.hash.match(/^#topic-(t[0-9a-z]+)$/);
  const t = m && DATA.topics.find(x => x.id === m[1]);
  if (t) { seg = "res"; renderThread(t); window.scrollTo(0, 0); }
  else { renderList(); window.scrollTo(0, listY); }
}
window.addEventListener("hashchange", route);
document.addEventListener("click", e => { if (e.target.closest(".row")) listY = window.scrollY; });
route();
</script>
